<!DOCTYPE HTML>
<html lang="en-AU">

<head>
  <title>Notes — Remy Ellis</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Notes by Remy Ellis on mathematics, software and other things worth keeping." />
  <meta name="theme-color" content="#0b7f98" />

  <link rel="icon" type="image/png" href="assets/css/images/Signature.png" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/remy.css" />
  <link rel="stylesheet" href="assets/css/notes.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="assets/js/notes.js"></script>
</head>

<body class="notes-page is-preload">
  <header class="notes-topbar">
    <a class="notes-brand" href="/" aria-label="Remy Ellis home">
      <img src="assets/css/images/Signature.png" alt="" width="38" height="38" />
      <span>Remy Ellis</span>
    </a>
    <nav aria-label="Notes navigation">
      <a href="/">Home</a>
      <a class="is-current" href="/notes.html">Notes</a>
    </nav>
  </header>

  <main class="notes-shell">
    <header class="notes-intro">
      <p class="eyebrow">Notes</p>
      <h1>Notes</h1>
      <p>Occasional notes on mathematics, software, and other things I am working through.</p>
    </header>

    <section aria-live="polite">
      <p id="notes-error" class="notes-message notes-error" hidden></p>
      <p id="notes-empty" class="notes-message" hidden>No notes here yet.</p>
      <div id="notes-list" class="notes-list">
        <p class="notes-message">Loading notes…</p>
      </div>
    </section>
  </main>

  <footer class="notes-footer">
    <p>&copy; 2026 Remy Ellis</p>
  </footer>
</body>

</html>
